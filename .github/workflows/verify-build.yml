name: Verify Next.js build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build with Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund # Cloud lock refresh for the verified PDF reader update.
      - name: Preserve dependency lock for cloud review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test invoice validation
        run: npm test
      - name: Prepare synthetic invoice
        run: npm run qa:fixture
      - name: Verify production build
        run: npm run build
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Browser, responsive and accessibility checks
        run: npm run test:e2e
      - name: Preserve public QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-browser-report
          path: |
            playwright-report/
            test-results/
            qa-output/
          retention-days: 7
          if-no-files-found: ignore
